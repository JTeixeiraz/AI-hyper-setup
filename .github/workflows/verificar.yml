name: verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node --test tests/manifesto.test.mjs
      - run: node --test tests/cerebro.test.mjs
      - run: npm run manifesto && git diff --exit-code manifesto.json
      - run: npm run validar

  integracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/integracao/rodar.sh
